<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --surface2:#22263a;
      --accent:  #6c63ff;
      --text:    #e8eaf6;
      --muted:   #8b8fa8;
      --border:  #2e3150;
      --green:   #4ade80;
      --yellow:  #facc15;
      --red:     #f87171;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── DECK & SLIDES ───────────────────────────────────── */
    .deck { width: 100%; height: 100vh; position: relative; overflow: hidden; }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 18px 44px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(36px);
      transition: opacity .3s ease, transform .3s ease;
    }

    .slide.active  { opacity: 1; pointer-events: all; transform: translateX(0); }
    .slide.exit    { opacity: 0; transform: translateX(-36px); }

    /* ── TOP BAR (shared) ────────────────────────────────── */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .top-left {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .item-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(108,99,255,.15);
      border-radius: 5px;
      padding: 2px 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .item-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }

    .item-desc {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 2;
    }

    /* ── TIMER ───────────────────────────────────────────── */
    .timer-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .timer-display {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--green);
      min-width: 58px;
      text-align: right;
      transition: color .3s;
    }

    .timer-display.warn   { color: var(--yellow); }
    .timer-display.urgent { color: var(--red); animation: pulse 1s infinite; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

    .timer-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 12px;
      cursor: pointer;
      transition: background .15s;
    }
    .timer-btn:hover { background: var(--accent); border-color: var(--accent); }

    .timer-set { display: flex; align-items: center; gap: 5px; }
    .timer-set input {
      width: 40px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
      text-align: center;
    }
    .timer-set input:focus { outline: none; border-color: var(--accent); }
    .timer-set input::-webkit-inner-spin-button,
    .timer-set input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .timer-set input { -moz-appearance: textfield; }
    .timer-set span { font-size: 11px; color: var(--muted); }

    .slide-counter { font-size: 11px; color: var(--muted); }

    /* ── PROGRESS BAR ────────────────────────────────────── */
    .timer-bar-track {
      position: absolute;
      bottom: 36px; left: 0; right: 0;
      height: 2px;
      background: var(--border);
    }
    .timer-bar {
      height: 100%;
      background: var(--accent);
      transition: width 1s linear, background .3s;
      width: 100%;
    }
    .timer-bar.warn   { background: var(--yellow); }
    .timer-bar.urgent { background: var(--red); }

    /* ── AGENDA SLIDE ────────────────────────────────────── */
    .agenda-hero {
      padding: 20px 0 32px;
      flex-shrink: 0;
    }

    .agenda-meeting {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .agenda-title {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.1;
    }

    .agenda-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    .agenda-item {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 28px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      height: 100px;
    }

    .agenda-item:hover {
      border-color: var(--accent);
      background: var(--surface2);
      transform: translateX(4px);
    }

    .agenda-num {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(108,99,255,.15);
      border-radius: 8px;
      padding: 6px 12px;
      flex-shrink: 0;
      min-width: 36px;
      text-align: center;
    }

    .agenda-text { flex: 1; }
    .agenda-topic { font-size: 18px; font-weight: 600; }
    .agenda-detail { font-size: 14px; color: var(--muted); margin-top: 4px; }

    .agenda-time {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      background: var(--surface2);
      border-radius: 8px;
      padding: 6px 12px;
      white-space: nowrap;
    }

    /* ── CARD CANVAS ─────────────────────────────────────── */
    .canvas-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .canvas-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .add-card-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      border-radius: 7px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
      white-space: nowrap;
    }
    .add-card-btn:hover { opacity: .82; }

    .card-canvas {
      position: relative;
      flex: 1;
      border: 1px dashed var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    /* ── CARDS ───────────────────────────────────────────── */
    .card {
      position: absolute;
      width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    .card.dragging {
      box-shadow: 0 12px 36px rgba(0,0,0,.55);
      z-index: 10;
      opacity: .95;
    }

    .card-handle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: var(--surface2);
      border-radius: 10px 10px 0 0;
      cursor: grab;
      user-select: none;
      flex-shrink: 0;
    }
    .card-handle:active { cursor: grabbing; }

    .card-grip { font-size: 10px; color: var(--border); letter-spacing: .2em; }

    .card-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 0;
      transition: color .15s;
    }
    .card-del:hover { color: var(--red); }

    .card-title-field {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      padding: 9px 11px 4px;
      resize: none;
      outline: none;
      overflow: hidden;
    }
    .card-title-field::placeholder { color: var(--muted); font-weight: 400; }

    .card-body-field {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      line-height: 1.55;
      padding: 2px 11px 10px;
      resize: none;
      outline: none;
      overflow: hidden;
      min-height: 38px;
    }
    .card-body-field::placeholder { color: var(--border); }

    /* ── NAV BAR ─────────────────────────────────────────── */
    .nav {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 12px;
      z-index: 100;
      box-shadow: 0 6px 24px rgba(0,0,0,.4);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 30px;
      font-size: 13px;
      transition: color .2s, background .2s;
    }
    .nav-btn:hover { color: var(--text); background: var(--surface2); }

    .nav-dots { display: flex; gap: 5px; align-items: center; padding: 0 4px; }

    .nav-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .nav-dot.active { background: var(--accent); transform: scale(1.6); }

    .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 2px; }

    /* ── ERROR STATE ─────────────────────────────────────── */
    .load-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: var(--red);
      text-align: center;
      padding: 40px;
    }
    .load-error .err-icon  { font-size: 48px; }
    .load-error .err-title { font-size: 18px; font-weight: 700; }
    .load-error .err-msg   { font-size: 13px; color: var(--muted); }
    .load-error .err-hint  { font-size: 12px; color: var(--border); }
  </style>
</head>
<body>

<div class="deck" id="deck"></div>

<nav class="nav">
  <button class="nav-btn" id="btn-prev">&#9664;</button>
  <div class="nav-dots" id="nav-dots"></div>
  <button class="nav-btn" id="btn-next">&#9654;</button>
  <div class="nav-sep"></div>
  <button class="nav-btn" id="btn-export">&#8595; Export</button>
</nav>

<script>
  // ── STATE ─────────────────────────────────────────────────
  let meetingData   = null;
  let slides        = [];
  let current       = 0;
  let timerInterval = null;
  let timerSeconds  = 0;
  let timerTotal    = 0;
  let timerRunning  = false;

  // ── HELPERS ───────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── LOAD ──────────────────────────────────────────────────
  async function init() {
    try {
      const res = await fetch('./meeting.json');
      if (!res.ok) throw new Error(`HTTP ${res.status} – ${res.statusText}`);
      meetingData = await res.json();
    } catch (e) {
      showError(e.message);
      return;
    }
    buildSlides();
    buildNavDots();
    wireGlobal();
    resetTimerForSlide();
    // Resize pre-seeded card textareas after DOM is laid out
    requestAnimationFrame(() =>
      document.querySelectorAll('.card-canvas textarea').forEach(autoResize));
  }

  function showError(msg) {
    $('deck').innerHTML = `
      <div class="load-error">
        <div class="err-icon">&#9888;</div>
        <div class="err-title">Failed to load meeting.json</div>
        <div class="err-msg">${esc(msg)}</div>
        <div class="err-hint">Serve this folder with a local HTTP server, e.g. <code>npx serve .</code></div>
      </div>`;
  }

  // ── BUILD SLIDES ──────────────────────────────────────────
  function buildSlides() {
    const deck  = $('deck');
    const total = meetingData.items.length + 1;

    deck.appendChild(buildAgendaSlide(meetingData, total));
    meetingData.items.forEach((item, idx) =>
      deck.appendChild(buildItemSlide(item, idx, meetingData.items.length, total)));

    slides = Array.from(deck.querySelectorAll('.slide'));
    slides[0].classList.add('active');
  }

  function buildAgendaSlide(meeting, total) {
    const mins = meeting.defaultTimerMins ?? 10;
    const div  = document.createElement('div');
    div.className = 'slide';
    div.id = 'slide-0';
    div.innerHTML = `
      <div class="top-bar">
        <div class="top-left">
          <span style="font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">${esc(meeting.name)}</span>
        </div>
        <div class="timer-wrap">
          <div class="timer-set">
            <input type="number" id="timer-input" value="${mins}" min="1" max="99">
            <span>min</span>
          </div>
          <button class="timer-btn" id="btn-start">&#9654; Start</button>
          <button class="timer-btn" id="btn-reset">&#x21BA;</button>
          <div class="timer-display" id="timer-display"></div>
          <span class="slide-counter">1 / ${total}</span>
        </div>
      </div>
      <div class="agenda-hero">
        <div class="agenda-meeting">Agenda</div>
        <div class="agenda-title">${esc(meeting.title)}</div>
      </div>
      <ul class="agenda-list" id="agenda-list"></ul>
      <div class="timer-bar-track"><div class="timer-bar" id="timer-bar"></div></div>`;

    const list = div.querySelector('#agenda-list');
    meeting.items.forEach((item, idx) => {
      const li = document.createElement('li');
      li.className = 'agenda-item';
      li.innerHTML = `
        <div class="agenda-num">${idx + 1}</div>
        <div class="agenda-text">
          <div class="agenda-topic">${esc(item.topic)}</div>
          <div class="agenda-detail">${esc(item.description)}</div>
        </div>
        <div class="agenda-time">${item.durationMins} min</div>`;
      li.addEventListener('click', () => goTo(idx + 1));
      list.appendChild(li);
    });

    div.querySelector('#btn-start').addEventListener('click', toggleTimer);
    div.querySelector('#btn-reset').addEventListener('click', () => { stopTimer(); resetTimerForSlide(); });
    div.querySelector('#timer-input').addEventListener('change', () => { if (!timerRunning) resetTimerForSlide(); });

    return div;
  }

  function buildItemSlide(item, idx, totalItems, totalSlides) {
    const div = document.createElement('div');
    div.className = 'slide';
    div.id = `slide-${idx + 1}`;
    div.dataset.itemIdx = idx;
    div.innerHTML = `
      <div class="top-bar">
        <div class="top-left">
          <span class="item-badge">${idx + 1} / ${totalItems}</span>
          <span class="item-title">${esc(item.topic)}</span>
          <span class="item-desc">${esc(item.description)}</span>
        </div>
        <div class="timer-wrap">
          <div class="timer-set">
            <input type="number" class="timer-input-s" value="${item.durationMins}" min="1" max="99">
            <span>min</span>
          </div>
          <button class="timer-btn s-start">&#9654; Start</button>
          <button class="timer-btn s-reset">&#x21BA;</button>
          <div class="timer-display"></div>
          <span class="slide-counter">${idx + 2} / ${totalSlides}</span>
        </div>
      </div>
      <div class="canvas-wrap">
        <div class="canvas-toolbar">
          <button class="add-card-btn">+ Card</button>
        </div>
        <div class="card-canvas"></div>
      </div>
      <div class="timer-bar-track"><div class="timer-bar"></div></div>`;

    div.querySelector('.s-start').addEventListener('click', toggleTimer);
    div.querySelector('.s-reset').addEventListener('click', () => { stopTimer(); resetTimerForSlide(); });
    div.querySelector('.timer-input-s').addEventListener('change', () => { if (!timerRunning) resetTimerForSlide(); });
    div.querySelector('.add-card-btn').addEventListener('click', () =>
      createCard(div.querySelector('.card-canvas')));

    const canvas = div.querySelector('.card-canvas');
    (item.cards ?? []).forEach(c => createCard(canvas, c.title, c.notes));

    return div;
  }

  // ── NAV DOTS ──────────────────────────────────────────────
  function buildNavDots() {
    const dotsEl = $('nav-dots');
    slides.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'nav-dot' + (i === 0 ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    });
  }

  // ── NAVIGATION ────────────────────────────────────────────
  function wireGlobal() {
    $('btn-prev').addEventListener('click', () => navigate(-1));
    $('btn-next').addEventListener('click', () => navigate(1));
    $('btn-export').addEventListener('click', exportMeeting);

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') navigate(1);
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')  navigate(-1);
      if (e.key === 'Escape') stopTimer();
      if (e.key === 'Enter')  toggleTimer();
    });
  }

  function goTo(idx) {
    if (idx < 0 || idx >= slides.length) return;
    stopTimer();
    slides[current].classList.remove('active');
    slides[current].classList.add('exit');
    const prev = current;
    current = idx;
    setTimeout(() => slides[prev]?.classList.remove('exit'), 350);
    slides[current].classList.add('active');
    slides[current].classList.remove('exit');
    document.querySelectorAll('.nav-dot').forEach((d, i) =>
      d.classList.toggle('active', i === current));
    resetTimerForSlide();
  }

  function navigate(dir) { goTo(current + dir); }

  // ── TIMER ─────────────────────────────────────────────────
  function timerEls() {
    const s = slides[current];
    return {
      display: s.querySelector('.timer-display'),
      bar:     s.querySelector('.timer-bar'),
      input:   s.querySelector('.timer-input-s') ?? s.querySelector('#timer-input'),
    };
  }

  function resetTimerForSlide() {
    stopTimer();
    const mins = parseInt(timerEls().input?.value) || 10;
    timerSeconds = timerTotal = mins * 60;
    renderTimer();
  }

  function renderTimer() {
    const { display, bar } = timerEls();
    if (!display) return;
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const pct   = timerTotal > 0 ? (timerSeconds / timerTotal) * 100 : 100;
    const state = pct <= 15 ? 'urgent' : pct <= 33 ? 'warn' : '';
    display.className = 'timer-display' + (state ? ' ' + state : '');
    if (bar) {
      bar.style.width = pct + '%';
      bar.className   = 'timer-bar' + (state ? ' ' + state : '');
    }
  }

  function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    timerInterval = setInterval(() => {
      if (timerSeconds <= 0) { stopTimer(); return; }
      timerSeconds--;
      renderTimer();
    }, 1000);
    syncStartBtns();
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    syncStartBtns();
  }

  function toggleTimer() { timerRunning ? stopTimer() : startTimer(); }

  function syncStartBtns() {
    slides[current].querySelectorAll('.s-start, #btn-start').forEach(b =>
      b.textContent = timerRunning ? '\u23F8 Pause' : '\u25B6 Start');
  }

  // ── CARDS ─────────────────────────────────────────────────
  function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

  function createCard(canvas, title = '', notes = '') {
    const n   = canvas.querySelectorAll('.card').length;
    const off = (n % 8) * 20;
    const card = document.createElement('div');
    card.className = 'card';
    card.style.cssText = `left:${16 + off}px;top:${16 + off}px`;
    card.innerHTML = `
      <div class="card-handle">
        <span class="card-grip">&middot; &middot; &middot; &middot; &middot;</span>
        <button class="card-del" title="Remove">&times;</button>
      </div>
      <textarea class="card-title-field" rows="1" placeholder="Title&#8230;"></textarea>
      <textarea class="card-body-field"  rows="2" placeholder="Notes&#8230;"></textarea>`;

    const titleField = card.querySelector('.card-title-field');
    const notesField = card.querySelector('.card-body-field');
    titleField.value = title;
    notesField.value = notes;

    card.querySelectorAll('textarea').forEach(ta => {
      ta.addEventListener('input', () => autoResize(ta));
      ta.addEventListener('keydown', e => e.stopPropagation());
      autoResize(ta);
    });
    card.querySelector('.card-del').addEventListener('click', () => card.remove());
    card.querySelector('.card-handle').addEventListener('mousedown', e => dragCard(e, card, canvas));

    canvas.appendChild(card);
    if (!title) titleField.focus();
    return card;
  }

  function dragCard(e, card, canvas) {
    e.preventDefault();
    const cr = canvas.getBoundingClientRect();
    const cd = card.getBoundingClientRect();
    const ox = e.clientX - cd.left;
    const oy = e.clientY - cd.top;
    card.classList.add('dragging');

    const onMove = e => {
      card.style.left = Math.max(0, Math.min(e.clientX - cr.left - ox, cr.width  - card.offsetWidth))  + 'px';
      card.style.top  = Math.max(0, Math.min(e.clientY - cr.top  - oy, cr.height - card.offsetHeight)) + 'px';
    };
    const onUp = () => {
      card.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup',   onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
  }

  // ── EXPORT ────────────────────────────────────────────────
  // Output conforms to export.schema.json
  // No presentation data (timers, positions, slide layout).
  function exportMeeting() {
    const now    = new Date().toISOString();
    const output = {
      meeting:     meetingData.name,
      title:       meetingData.title,
      exported_at: now,
      items: slides
        .filter(s => s.dataset.itemIdx !== undefined)
        .map(s => {
          const item = meetingData.items[parseInt(s.dataset.itemIdx)];
          return {
            topic:       item.topic,
            description: item.description ?? '',
            cards: Array.from(s.querySelectorAll('.card'))
              .map(c => ({
                title: c.querySelector('.card-title-field').value.trim(),
                notes: c.querySelector('.card-body-field').value.trim(),
              }))
              .filter(c => c.title || c.notes),
          };
        }),
    };

    const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
    const a = Object.assign(document.createElement('a'), {
      href:     URL.createObjectURL(blob),
      download: `export-${now.slice(0, 10)}.json`,
    });
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ── START ─────────────────────────────────────────────────
  init();
</script>
</body>
</html>
