# Which GPG keys each secret is encrypted to — one fingerprint per machine.
# Adding a machine: `./secrets/enroll-machine` appends the fingerprint and
# re-encrypts. See secrets/README.md §5.
creation_rules:
  - path_regex: secrets/.*\.env$
    pgp: >-
      5388291D311E61360EC2B525993F224CB486BF2E
